name: Deploy (Docker / GHCR / multi-env)

# One workflow, many environments. The branch selects a GitHub Environment; GitHub supplies that
# environment's secrets. Config model:
#
#   - Committed appsettings.Production.json (in the image) — environment-invariant NON-SECRET config
#     (cookies, JWT issuer/audience/expiry, SMS ApiUrl/FromNumber, DataSeedSettings except the seed
#     password). No secrets, no CORS. Loaded on every server (all run Production).
#   - GitHub Environment SECRET `ENV_FILE` — the entire server .env for that environment, verbatim:
#     every app secret, plus CORS origins (Cors__AllowedOrigins__N), MSSQL_SA_PASSWORD,
#     UPLOADS_HOST_PATH and CLOUDFLARE_TUNNEL_TOKEN. The secret name is identical in every
#     environment; injected env vars override the blank placeholders in appsettings.Production.json.
#   - GitHub Environment VARIABLE `DEPLOY_DIR` — server path to write .env into / run compose from
#     (needed before .env exists, so it stays a separate variable).
#   - Deploy-only SECRETS (not in .env): DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY.
#
# ASPNETCORE_ENVIRONMENT is pinned to Production in docker-compose.deploy.yml, not injected.
# GITHUB_TOKEN is automatic (GHCR push + server-side pull). No PAT.

on:
  push:
    branches:
      - development
      - redesign/ci-cd
      # - staging     # add the matching case below + a 'staging' GitHub Environment
      # - production  # add the matching case below + a 'production' GitHub Environment

permissions:
  contents: read
  packages: write

jobs:
  setup:
    name: Resolve environment from branch
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.map.outputs.environment }}
    steps:
      - id: map
        run: |
          case "${{ github.ref_name }}" in
            development) echo "environment=development" >> "$GITHUB_OUTPUT" ;;
            redesign/ci-cd) echo "environment=development" >> "$GITHUB_OUTPUT" ;;
            # staging)    echo "environment=staging"    >> "$GITHUB_OUTPUT" ;;
            # production) echo "environment=production" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::No environment mapping for branch '${{ github.ref_name }}'"; exit 1 ;;
          esac

  build-and-push:
    name: Build image and push to GHCR
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        # GHCR requires a lowercase path; the repo slug (Silk-Route-Connect/Ombor.API) is mixed case.
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.sha }}
            ${{ steps.image.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ needs.setup.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [setup, build-and-push]
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Checkout code
        # Needed so we can ship the repo's compose file to the server this run.
        uses: actions/checkout@v4

      - name: Encode .env from the ENV_FILE secret
        id: dotenv
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          # The entire .env for this environment is one secret, ENV_FILE, shipped verbatim. The secret
          # name is identical across environments; GitHub supplies the resolved environment's value.
          if [ -z "${ENV_FILE:-}" ]; then
            echo "::error::ENV_FILE secret is empty or unset for this environment"; exit 1
          fi
          # base64 so the multi-line blob survives transit and never prints; mask it belt-and-braces.
          B64="$(printf '%s' "$ENV_FILE" | base64 -w0)"
          echo "::add-mask::$B64"
          echo "env_b64=$B64" >> "$GITHUB_OUTPUT"

      - name: Encode compose file for transfer
        id: compose
        run: echo "b64=$(base64 -w0 docker-compose.deploy.yml)" >> "$GITHUB_OUTPUT"

      - name: Sync compose, write .env, pull and restart
        uses: appleboy/ssh-action@v1
        env:
          ENV_B64: ${{ steps.dotenv.outputs.env_b64 }}
          COMPOSE_B64: ${{ steps.compose.outputs.b64 }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: ENV_B64,COMPOSE_B64,GHCR_USER,GHCR_TOKEN,DEPLOY_DIR
          script: |
            set -eu
            test -n "$DEPLOY_DIR" || { echo "DEPLOY_DIR not set for this environment"; exit 1; }
            cd "$DEPLOY_DIR"
            umask 077
            # Ship the repo's compose file every deploy so compose changes land by commit, not by hand.
            echo "$COMPOSE_B64" | base64 -d > docker-compose.deploy.yml.tmp
            mv -f docker-compose.deploy.yml.tmp docker-compose.deploy.yml
            # Write .env atomically; never echo its contents. Guard against an empty decode.
            echo "$ENV_B64" | base64 -d > .env.tmp
            test -s .env.tmp || { echo ".env is empty after decode"; exit 1; }
            mv -f .env.tmp .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml up -d
            docker image prune -f
