name: Deploy (Docker / GHCR / multi-env)

# One workflow, many environments. The branch selects a GitHub Environment; GitHub injects
# that environment's secret set. App config follows a three-way split:
#
#   1. Committed appsettings.Production.json (in the image) — environment-invariant NON-SECRET
#      config: cookie settings, JWT issuer/audience/expiry, SMS ApiUrl/FromNumber,
#      DataSeedSettings (except the seed password). Loaded on every server (all run Production).
#   2. GitHub Environment SECRETS — written into the server .env and injected as env vars,
#      overriding the blank placeholders in appsettings.Production.json:
#        ConnectionStrings__DefaultConnection, JwtSettings__Key, SmsSettings__Token,
#        Sentry__Dsn, MSSQL_SA_PASSWORD, DataSeedSettings__SeedUserPassword,
#        CLOUDFLARE_TUNNEL_TOKEN (consumed by the cloudflared service in compose)
#      Plus deploy-only secrets (NOT written to .env): DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
#   3. GitHub Environment VARIABLES — written to .env: Cors__AllowedOrigins__0 [__1 ...]
#      (per-environment CORS origins) and UPLOADS_HOST_PATH (compose bind mount).
#      Plus deploy-only: DEPLOY_DIR (cd target, NOT written to .env).
#
# ASPNETCORE_ENVIRONMENT is pinned to Production in docker-compose.deploy.yml, not injected.
# GITHUB_TOKEN is automatic (GHCR push + server-side pull). No PAT.

on:
  push:
    branches:
      - development
      - ci-cd
      # - staging     # add the matching case below + a 'staging' GitHub Environment
      # - production  # add the matching case below + a 'production' GitHub Environment

permissions:
  contents: read
  packages: write

jobs:
  setup:
    name: Resolve environment from branch
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.map.outputs.environment }}
    steps:
      - id: map
        run: |
          case "${{ github.ref_name }}" in
            development) echo "environment=development" >> "$GITHUB_OUTPUT" ;;
            ci-cd) echo "environment=development" >> "$GITHUB_OUTPUT" ;;
            # staging)    echo "environment=staging"    >> "$GITHUB_OUTPUT" ;;
            # production) echo "environment=production" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::No environment mapping for branch '${{ github.ref_name }}'"; exit 1 ;;
          esac

  build-and-push:
    name: Build image and push to GHCR
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        # GHCR requires a lowercase path; the repo slug (Silk-Route-Connect/Ombor.API) is mixed case.
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.sha }}
            ${{ steps.image.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ needs.setup.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [setup, build-and-push]
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Checkout code
        # Needed so we can ship the repo's compose file to the server this run.
        uses: actions/checkout@v4

      - name: Assemble .env from this environment's secrets and variables
        id: dotenv
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          # Keep app config: keys with "__" (ASP.NET nesting) plus the flat keys listed below. This
          # drops deploy plumbing (DEPLOY_*, github_token) and any unrelated repo secret/var, none of
          # which use "__". Secrets fill the blank values in appsettings.Production.json; CORS origins
          # (Cors__AllowedOrigins__N) and UPLOADS_HOST_PATH are non-secret env-provisioned variables;
          # CLOUDFLARE_TUNNEL_TOKEN is a secret consumed by the cloudflared service in compose.
          KEEP='^[^=]*__[^=]*=|^(MSSQL_SA_PASSWORD|UPLOADS_HOST_PATH|CLOUDFLARE_TUNNEL_TOKEN)='
          {
            jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"$SECRETS_JSON"
            jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"$VARS_JSON"
          } | grep -E "$KEEP" > deploy.env || true

          # Fail loudly rather than deploy a half-configured container; the app's ValidateOnStart
          # covers the rest once it boots. CORS is required here since it no longer lives in appsettings.
          require() { grep -q "^$1=." deploy.env || { echo "::error::Missing required key: $1"; exit 1; }; }
          require ConnectionStrings__DefaultConnection
          require JwtSettings__Key
          require MSSQL_SA_PASSWORD
          require UPLOADS_HOST_PATH
          require Cors__AllowedOrigins__0
          require CLOUDFLARE_TUNNEL_TOKEN

          # base64 so the blob survives transit and never prints; mask it belt-and-braces.
          B64="$(base64 -w0 deploy.env)"
          echo "::add-mask::$B64"
          echo "env_b64=$B64" >> "$GITHUB_OUTPUT"

      - name: Encode compose file for transfer
        id: compose
        run: echo "b64=$(base64 -w0 docker-compose.deploy.yml)" >> "$GITHUB_OUTPUT"

      - name: Sync compose, write .env, pull and restart
        uses: appleboy/ssh-action@v1
        env:
          ENV_B64: ${{ steps.dotenv.outputs.env_b64 }}
          COMPOSE_B64: ${{ steps.compose.outputs.b64 }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: ENV_B64,COMPOSE_B64,GHCR_USER,GHCR_TOKEN,DEPLOY_DIR
          script: |
            set -eu
            test -n "$DEPLOY_DIR" || { echo "DEPLOY_DIR not set for this environment"; exit 1; }
            cd "$DEPLOY_DIR"
            umask 077
            # Ship the repo's compose file every deploy so compose changes land by commit, not by hand.
            echo "$COMPOSE_B64" | base64 -d > docker-compose.deploy.yml.tmp
            mv -f docker-compose.deploy.yml.tmp docker-compose.deploy.yml
            # Write .env atomically; never echo its contents.
            echo "$ENV_B64" | base64 -d > .env.tmp
            mv -f .env.tmp .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml up -d
            docker image prune -f
